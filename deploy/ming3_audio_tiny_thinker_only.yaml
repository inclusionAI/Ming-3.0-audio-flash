# Ming-3.0-audio-tiny thinker-only: audio understanding with text output.
pipeline: bailing_moe_v3_audio_thinker_only
async_chunk: false
trust_remote_code: false
distributed_executor_backend: mp
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_model_len: 131072
    max_num_batched_tokens: 32768
    limit_mm_per_prompt:
      audio:
        count: 1
        length: 20000000
    gpu_memory_utilization: 0.92
    enforce_eager: false
    async_scheduling: false
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true
      ignore_eos: false

platforms: {}
